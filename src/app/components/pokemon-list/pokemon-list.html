<div class="pokemon-list-container">
  <h1 class="title">Pokemon Fundamental Guide</h1>

  @if (loading()) {
    <div class="loading">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Cargando Pokémon...</p>
    </div>
  } @else {
    <div class="pokemon-grid">
      @for (pokemon of pokemons(); track pokemon.name) {
        <div class="pokemon-card" (click)="goToDetail(pokemon.url)">
          <div class="pokemon-card-id">#{{ getPokemonId(pokemon.url) }}</div>
          <img
            [src]="getPokemonImage(pokemon.url)"
            [alt]="pokemon.name"
            class="pokemon-card-image"
            loading="lazy"
          />
          <p class="pokemon-card-name">{{ pokemon.name }}</p>
        </div>
      }
    </div>

    <div class="pagination">
      <button
        mat-raised-button
        (click)="previousPage()"
        [disabled]="currentPage() === 1"
      >
        <mat-icon>chevron_left</mat-icon>
        Anterior
      </button>
      <span class="pagination-info">
        Página {{ currentPage() }} de {{ totalPages }}
      </span>
      <button
        mat-raised-button
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages"
      >
        Siguiente
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  }
</div>
